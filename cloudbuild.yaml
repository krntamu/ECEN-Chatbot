steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: Build
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '-f'
      - 'Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: Push
    args:
      - 'push'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: Deploy
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update'
      - '${_SERVICE_NAME}'
      - '--platform=${_PLATFORM}'
      - '--image=${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=${COMMIT_SHA},gcb-build-id=${BUILD_ID},gcb-trigger-id=${_TRIGGER_ID}'
      - '--region=${_DEPLOY_REGION}'
      # Resource + scaling flags pinned here so CI deploys are deterministic and
      # don't drift from the manual deploy_gcp.sh. min-instances=1 keeps one
      # backend warm (models stay resident in RAM) so requests don't pay the
      # 5-10s model-reload cold start. Flip _MIN_INSTANCES to 0 to scale to zero
      # and save the ~$40/mo idle cost (at the cost of cold starts).
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=4'
      - '--memory=4Gi'
      # 2, not 4. Measured 2026-08-09: the cross-encoder does NOT scale with
      # cores — per-pair cost stayed ~150ms at both 2 and 4 vCPU, so the extra
      # cores were pure cost. Latency comes down by sending fewer pairs
      # (_RETRIEVAL_TUNING below), not by adding CPU.
      - '--cpu=2'
      - '--cpu-boost'
      # Retrieval/latency tuning, pinned so a build can't silently revert it.
      # Baseline was ~8.6s of cross-encoding per request at ~56 pairs.
      #   DENSE_TOP_K 40->25, KEYWORD_TOP_K 20->10  : fewer candidate pairs,
      #     and cross-encode time is linear in pair count.
      #   RERANK_MAX_LEN 512->384 : shorter sequences per pair. Do NOT drop to
      #     256 — a previous attempt measurably hurt ranking quality.
      #   TORCH_NUM_THREADS must match --cpu; the code defaults to 4, which
      #     oversubscribed the 2 allocated cores.
      #   ENABLE_FUZZY=0 : the pg_trgm arm cost ~1s of db_arms plus 10-15 extra
      #     cross-encoder pairs and did not fix the typo case it was meant to
      #     (see the typo correction in retriever._signal_terms instead).
      - '--update-env-vars=${_RETRIEVAL_TUNING}'
      - '--timeout=600'
      # Mounts the Cloud SQL Unix socket at /cloudsql/<connection-name>. PG_DSN
      # (set as an env var on the service, not here — it holds the password)
      # points at that path. Without this flag a deploy silently drops the
      # attachment and every question fails with "No such file or directory".
      - '--add-cloudsql-instances=${_CLOUDSQL_INSTANCE}'
      - '--quiet'

  # Keep the nightly re-index job on the same image. `jobs deploy` creates the
  # job on first run and updates it afterwards. Env vars set manually on the
  # job (PG_DSN) persist across deploys; --update-env-vars only touches the
  # listed keys.
  #
  # NOTE: the job's env vars are a SEPARATE set from the service's, and nothing
  # reconciles them. A password rotated on the service but not here is what
  # broke the nightly re-index for 36 straight nights (2026-07-05 → 08-09) and
  # let the idle Supabase project auto-pause. Rotate PG_DSN in BOTH places, or
  # move both to one Secret Manager secret.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: DeployReindexJob
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'ecen-reindex'
      - '--image=${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region=${_DEPLOY_REGION}'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--task-timeout=45m'
      - '--max-retries=1'
      - '--command=sh'
      - '--args=-c,cd /app/crawler && python ingest.py --diff'
      - '--update-env-vars=EMBEDDING_MODEL=all-MiniLM-L6-v2'
      # `jobs deploy` rewrites job config, so the socket attachment must be
      # declared here or it is lost on the next build.
      - '--set-cloudsql-instances=${_CLOUDSQL_INSTANCE}'
      - '--quiet'

images:
  - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY

# Defaults — trigger-level substitution variables override these.
substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_PROJECT_ID: gcp-clen-ecen-ai-initiatives
  _AR_REPOSITORY: cloud-run-source-deploy
  _SERVICE_NAME: ecen-chatbot
  _DEPLOY_REGION: us-central1
  _PLATFORM: managed
  _TRIGGER_ID: manual
  # Warm instances kept alive 24/7. 1 = no cold starts (~$38-40/mo idle cost for
  # 2 vCPU / 4Gi); 0 = scale to zero (free when idle, but cold starts return).
  # Set to 0: scale to zero, no idle charge. Flip to 1 if cold starts become a
  # problem and you'd rather pay to keep one instance warm.
  _MIN_INSTANCES: '0'
  # Cloud SQL instance backing ecen_docs (migrated off Supabase 2026-08-09).
  # Format is project:region:instance. The password lives only in the PG_DSN
  # env var on the service and the job — never in this file.
  _CLOUDSQL_INSTANCE: gcp-clen-ecen-ai-initiatives:us-central1:ecen-pg
  # Retrieval latency knobs — see the comment on the Deploy step. Only these
  # keys are touched (--update-env-vars merges), so PG_DSN and the API keys set
  # manually on the service are preserved across builds.
  _RETRIEVAL_TUNING: 'DENSE_TOP_K=25,KEYWORD_TOP_K=10,RERANK_MAX_LEN=384,TORCH_NUM_THREADS=2,ENABLE_FUZZY=0'
