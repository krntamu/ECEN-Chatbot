# Runs on every PR and push to main, for humans and bots alike.
#
# codex.yml runs these same gates, but only inside the @codex issue-fix flow.
# A PR opened by a person (or a direct push) previously ran no tests at all.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - name: py_compile
        run: python -m py_compile backend/*.py crawler/*.py scripts/*.py tests/*.py
      - name: pytest
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --legacy-peer-deps
      - run: npm test
      - run: npm run build

  audit:
    # Known-vulnerability scan. Reports without failing the build for now:
    # start by reading the output, then flip continue-on-error off once the
    # backlog is clear so new advisories block merges.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: pip-audit (pinned versions, if any)
        run: |
          if grep -qvE '^\s*(#|$)' pinned-requirements.txt; then
            pip-audit -r pinned-requirements.txt --no-deps --disable-pip
          else
            echo "pinned-requirements.txt has no pins yet (run scripts/lock_deps.sh); auditing requirements instead"
            pip-audit -r backend/requirements.txt -r crawler/requirements.txt || true
          fi
      - name: npm audit (production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
